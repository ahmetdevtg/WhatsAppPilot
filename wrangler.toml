name = "whatsapp-pilot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
logpush = true

[[d1_databases]]
binding = "DB"
database_name = "whatsapp-pilot-db"
database_id = "5fec5ed8-9e7f-48af-aa37-b91fb1aa628e"
migrations_dir = "migrations"

[[queues.producers]]
binding = "SEND_QUEUE"
queue = "whatsapp-pilot-send"

[[queues.consumers]]
queue = "whatsapp-pilot-send"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60

[vars]
APP_NAME = "WhatsAppPilot"
WHATSAPP_API_VERSION = "v23.0"
